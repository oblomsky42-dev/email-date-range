name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[test]" ruff
      - name: Install pffexport (real-output test of recover-pst --method deep)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pff-tools
      - name: Lint
        run: ruff check src tests scripts
      - name: Download public PST fixtures
        run: python scripts/fetch_test_data.py
      - name: Test
        run: python -m pytest
