name: Windows executables

# Builds email_date_range.exe and recover_pst.exe.
# On a version tag (v1.2.3) they are attached to a GitHub release;
# a manual run just uploads them as a workflow artifact.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build
        shell: cmd
        env:
          PY: python
        run: scripts\build_exe.bat
      - uses: actions/upload-artifact@v7
        with:
          name: windows-executables
          path: dist/*.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.exe
          generate_release_notes: true
